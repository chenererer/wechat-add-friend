<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>添加好友 - CHIP.</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1a73e8 0%, #1557b0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 380px;
            padding: 40px 30px 30px;
            text-align: center;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a73e8 0%, #1557b0 100%);
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #fff;
        }
        .nickname {
            font-size: 22px;
            font-weight: 700;
            color: #191919;
            margin-bottom: 4px;
        }
        .wechat-id {
            font-size: 14px;
            color: #999;
            margin-bottom: 20px;
        }
        .qr-wrapper {
            background: #f7f7f7;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: inline-block;
        }
        .qr-wrapper img {
            width: 200px;
            height: 200px;
            display: block;
            border-radius: 8px;
        }
        .qr-hint {
            font-size: 13px;
            color: #888;
            margin-top: 8px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            margin-bottom: 12px;
        }
        .btn-primary {
            background: #1a73e8;
            color: #fff;
        }
        .btn-primary:hover { background: #1557b0; }
        .btn-primary:active { transform: scale(0.97); }
        .btn-outline {
            background: #fff;
            color: #1a73e8;
            border: 1.5px solid #1a73e8;
        }
        .welcome {
            font-size: 13px;
            color: #aaa;
            margin-top: 20px;
            line-height: 1.6;
        }
        .footer {
            font-size: 12px;
            color: #ccc;
            margin-top: 16px;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .overlay.show { display: flex; }
        .overlay-box {
            background: #fff;
            border-radius: 16px;
            padding: 30px 24px;
            text-align: center;
            max-width: 320px;
            width: 90%;
        }
        .overlay-box .icon { font-size: 48px; margin-bottom: 12px; }
        .overlay-box p { font-size: 15px; color: #333; margin-bottom: 8px; line-height: 1.8; }
        .overlay-box .step {
            display: inline-block;
            background: #1a73e8; color: #fff;
            border-radius: 50%; width: 22px; height: 22px;
            line-height: 22px; text-align: center; margin-right: 6px;
            font-weight: bold; font-size: 12px;
        }
        .overlay-box .btn-close {
            background: #1a73e8; color: #fff;
            border: none; padding: 10px 40px; border-radius: 8px;
            font-size: 15px; cursor: pointer; margin-top: 12px;
        }
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 10px 24px;
            border-radius: 20px; font-size: 14px; z-index: 10000;
            opacity: 0; transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }
        .pc-tip {
            display: none;
            background: #fffbe6; border: 1px solid #ffe58f;
            border-radius: 8px; padding: 10px 14px; margin-bottom: 16px;
            font-size: 13px; color: #ad6800; text-align: left; line-height: 1.6;
        }
        .pc-tip.show { display: block; }
        .app-browser-tip {
            display: none;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-radius: 12px; padding: 16px; margin-bottom: 20px;
            color: #fff; font-size: 14px; line-height: 1.8;
            animation: pulse 2s infinite;
        }
        .app-browser-tip.show { display: block; }
        .app-browser-tip .tip-step {
            display: inline-block;
            background: rgba(255,255,255,0.25); color: #fff;
            border-radius: 50%; width: 22px; height: 22px;
            line-height: 22px; text-align: center; margin-right: 6px;
            font-weight: bold; font-size: 12px;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,107,0.4); }
            50% { box-shadow: 0 0 0 12px rgba(255,107,107,0); }
        }
        .scan-guide {
            display: none;
            background: #f0f4ff; border-radius: 8px;
            padding: 12px 14px; margin-top: 12px;
            font-size: 13px; color: #333; text-align: center; line-height: 1.8;
        }
        .scan-guide.show { display: block; }
        .btn-action {
            display: none;
        }
        .btn-action.show { display: block; }
    </style>
</head>

        var isAppBrowser = /aweme|douyin|kuaishou|kwai|weibo|qq/i.test(ua) && !isWechat && !isWxWork;

        // 二维码中解码出的直达链接
        var deepLink = "https://work.weixin.qq.com/u/vc967f7429b0dc5fce?v=5.0.9.224799&bb=31aa0b4d49";
        var personalLink = "";
        var schemeUrl = "wxwork://";
        var hasDeepLink = deepLink.length > 0;

        (function() {
            if (isAppBrowser) {
                // App 内置浏览器：引导用系统浏览器打开
                document.getElementById('appBrowserTip').classList.add('show');
                document.getElementById('btnAction').classList.remove('show');
                document.getElementById('footerHint').innerText = '或截图保存二维码，用' + (isWorkWechat ? '企业微信' : '微信') + '扫一扫';
            } else if (isWechat || isWxWork) {
                // 微信/企业微信内置浏览器中：隐藏按钮，提示长按扫码
                document.getElementById('btnAction').classList.remove('show');
                var appName = isWxWork ? '企业微信' : '微信';
                document.getElementById('footerHint').innerText = '在' + appName + '内打开？长按上方二维码识别即可添加';
            } else if (isMobile) {
                // 手机浏览器：显示按钮
                document.getElementById('btnAction').classList.add('show');
                document.getElementById('scanGuide').classList.add('show');
                document.getElementById('footerHint').innerText = '用' + (isWorkWechat ? '企业微信' : '微信') + '扫一扫扫描上方二维码即可';
            } else {
                // PC 端
                document.getElementById('pcTip').classList.add('show');
                document.getElementById('footerHint').innerText = '用手机' + (isWorkWechat ? '企业微信' : '微信') + '扫码即可添加';
            }
        })();

        function handleOpenApp(e) {
            // 企业微信策略:
            //   1. wxwork:// 唤起 App（已验证有效）
            //   2. Android 上尝试 Intent URL 直接打开资料页
            //   个人微信策略: weixin:// + iframe 双保险
            e.preventDefault();

            if (isWorkWechat) {
                // --- 企业微信模式 ---
                // 步骤 1: wxwork:// 唤起 App
                try { window.location.href = schemeUrl; } catch(ex) {}

                // 步骤 2: Android 上尝试 Intent URL（带 HTTP 链接，可能直接打开资料页）
                var isAndroid = /Android/i.test(navigator.userAgent);
                if (isAndroid && hasDeepLink) {
                    setTimeout(function() {
                        try {
                            var intentUrl = 'intent://work.weixin.qq.com/u/' +
                                deepLink.split('/u/')[1].split('?')[0] +
                                '?' + deepLink.split('?')[1] +
                                '#Intent;scheme=https;package=com.tencent.wework;end';
                            window.location.href = intentUrl;
                        } catch(ex) {}
                    }, 800);
                }

                // 2 秒后页面还在 → 弹出搜索引导
                setTimeout(function() {
                    if (document.hidden || document.webkitHidden) return;
                    document.getElementById('overlay').classList.add('show');
                }, 2000);
            } else {
                // --- 个人微信模式 ---
                try { window.location.href = schemeUrl; } catch(ex) {}
                var iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = schemeUrl;
                document.body.appendChild(iframe);
                setTimeout(function() {
                    if (document.body.contains(iframe)) document.body.removeChild(iframe);
                }, 2000);
                setTimeout(function() {
                    if (document.hidden || document.webkitHidden) return;
                    document.getElementById('overlay').classList.add('show');
                }, 1500);
            }
        }

        function showToast(msg) {
            var t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(function() { t.classList.remove('show'); }, 2000);
        }

        function copyWechatId() {
            var id = 'Wang-CHIP';
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(id).then(function() {
                    showToast('已复制: ' + id);
                }).catch(function() {
                    fallbackCopy(id);
                });
            } else {
                fallbackCopy(id);
            }
        }

        function fallbackCopy(text) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;left:-9999px;top:0;';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try { document.execCommand('copy'); showToast('已复制: ' + text); }
            catch(e) { alert('账号: ' + text); }
            document.body.removeChild(ta);
        }
    </script>
</body>
</html>
