<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>添加微信好友 - CHIP.</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #07c160 0%, #06ad56 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 380px;
            padding: 40px 30px 30px;
            text-align: center;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #07c160, #06ad56);
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #fff;
        }
        .nickname {
            font-size: 22px;
            font-weight: 700;
            color: #191919;
            margin-bottom: 4px;
        }
        .wechat-id {
            font-size: 14px;
            color: #999;
            margin-bottom: 20px;
        }
        .qr-wrapper {
            background: #f7f7f7;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: inline-block;
        }
        .qr-wrapper img {
            width: 200px;
            height: 200px;
            display: block;
            border-radius: 8px;
        }
        .qr-hint {
            font-size: 13px;
            color: #888;
            margin-top: 8px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            margin-bottom: 12px;
        }
        .btn-primary {
            background: #07c160;
            color: #fff;
        }
        .btn-primary:hover { background: #06ad56; }
        .btn-primary:active { transform: scale(0.97); }
        .btn-outline {
            background: #fff;
            color: #07c160;
            border: 1.5px solid #07c160;
        }
        .welcome {
            font-size: 13px;
            color: #aaa;
            margin-top: 20px;
            line-height: 1.6;
        }
        .footer {
            font-size: 12px;
            color: #ccc;
            margin-top: 16px;
        }
        /* 移动端遮罩提示 */
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .overlay.show { display: flex; }
        .overlay-box {
            background: #fff;
            border-radius: 16px;
            padding: 30px 24px;
            text-align: center;
            max-width: 300px;
            width: 90%;
        }
        .overlay-box .icon { font-size: 48px; margin-bottom: 12px; }
        .overlay-box p { font-size: 15px; color: #333; margin-bottom: 20px; line-height: 1.6; }
        .overlay-box .btn-close {
            background: #07c160;
            color: #fff;
            border: none;
            padding: 10px 40px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 10px 24px;
            border-radius: 20px; font-size: 14px; z-index: 10000;
            opacity: 0; transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }
        .pc-tip {
            display: none;
            background: #fffbe6; border: 1px solid #ffe58f;
            border-radius: 8px; padding: 10px 14px; margin-bottom: 16px;
            font-size: 13px; color: #ad6800; text-align: left; line-height: 1.6;
        }
        .pc-tip.show { display: block; }
        .app-browser-tip {
            display: none;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-radius: 12px; padding: 16px; margin-bottom: 20px;
            color: #fff; font-size: 14px; line-height: 1.8;
            animation: pulse 2s infinite;
        }
        .app-browser-tip.show { display: block; }
        .app-browser-tip .step {
            display: inline-block;
            background: rgba(255,255,255,0.25); color: #fff;
            border-radius: 50%; width: 22px; height: 22px;
            line-height: 22px; text-align: center; margin-right: 6px;
            font-weight: bold; font-size: 12px;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,107,0.4); }
            50% { box-shadow: 0 0 0 12px rgba(255,107,107,0); }
        }
        .scan-guide {
            display: none;
            background: #f0faf4; border-radius: 8px;
            padding: 12px 14px; margin-top: 12px;
            font-size: 13px; color: #333; text-align: center; line-height: 1.8;
        }
        .scan-guide.show { display: block; }
        .btn-wechat {
            display: none;
        }
        .btn-wechat.show { display: block; }
    </style>
</head>

        </a>

        <div class="scan-guide" id="scanGuide">

        <button class="btn btn-outline" onclick="copyWechatId()">
            复制微信号
        </button>

    <div class="toast" id="toast"></div>

    <!-- 唤起微信后的引导 -->
    <div class="overlay" id="overlay">
        <div class="overlay-box">
            <div class="icon">&#x1F4F1;</div>
            <p><strong>微信扫一扫已打开</strong></p>
            <p style="text-align:left;font-size:14px;color:#555;line-height:2;">
                <span class="step">1</span> 将手机摄像头对准<strong>上方二维码</strong><br>
                <span class="step">2</span> 微信会自动识别并跳转到资料页<br>
                <span class="step">3</span> 点击「<strong>添加到通讯录</strong>」

    <script>
        // 判断设备类型
        var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        var isWechat = /MicroMessenger/i.test(navigator.userAgent);
        var ua = navigator.userAgent.toLowerCase();
        // 检测常见 App 内置浏览器：抖音、快手、微博、QQ、小红书等
        var isAppBrowser = /aweme|douyin|kuaishou|kwai|weibo|qq/i.test(ua) && !isWechat;

        (function() {
            if (isAppBrowser) {
                // 抖音等 App 内置浏览器：weixin:// 被拦截，引导用户用浏览器打开
                document.getElementById('appBrowserTip').classList.add('show');
                document.getElementById('btnWechat').classList.remove('show');
                document.getElementById('footerHint').innerText = '或截图保存二维码，在微信中扫一扫';
            } else if (isWechat) {
                // 在微信内置浏览器中
                document.getElementById('btnWechat').classList.remove('show');
                document.getElementById('footerHint').innerText = '在微信内打开？长按上方二维码识别即可添加';
            } else if (isMobile) {
                // 手机浏览器：显示按钮 + 扫码引导
                document.getElementById('btnWechat').classList.add('show');
                document.getElementById('scanGuide').classList.add('show');
                document.getElementById('footerHint').innerText = '用微信扫一扫扫描上方二维码即可';
            } else {
                // PC 端：显示提示
                document.getElementById('pcTip').classList.add('show');
                document.getElementById('footerHint').innerText = '用手机微信扫码即可添加';
            }
        })();

        function openWechatScan(e) {
            e.preventDefault();

            // weixin://dl/scan 直接打开微信扫一扫页面
            window.location.href = 'weixin://dl/scan';

            // Android 兼容：用 iframe 再试一次
            var iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = 'weixin://dl/scan';
            document.body.appendChild(iframe);

            // 2.5 秒后如果页面还在，说明唤起失败
            setTimeout(function() {
                document.body.removeChild(iframe);
                if (document.hidden || document.webkitHidden) return;
                document.getElementById('overlay').classList.add('show');
            }, 2500);
        }

        function showToast(msg) {
            var t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(function() { t.classList.remove('show'); }, 2000);
        }

        function copyWechatId() {
            var id = 'Wang-CHIP';
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(id).then(function() {
                    showToast('微信号已复制: ' + id);
                }).catch(function() {
                    fallbackCopy(id);
                });
            } else {
                fallbackCopy(id);
            }
        }

        function fallbackCopy(text) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;left:-9999px;top:0;';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try { document.execCommand('copy'); showToast('微信号已复制: ' + text); }
            catch(e) { alert('微信号: ' + text); }
            document.body.removeChild(ta);
        }
    </script>
